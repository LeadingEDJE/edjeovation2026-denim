services:
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
      target: runtime
    environment:
      API_PORT: 4000
      DATABASE_URL: postgres://denim:denim@postgres:5432/denim_fit
      THIRD_PARTY_BASE_URL: http://wiremock:8080
      # Optional: set these in a gitignored .env to enable Claude re-ranking;
      # unset falls back to rule-based scoring. ANTHROPIC_BASE_URL can point at a
      # compatible proxy (e.g. a LiteLLM gateway); RECOMMENDER_MODEL must be a
      # model that endpoint serves (e.g. claude-opus-4.7 on LiteLLM).
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      ANTHROPIC_BASE_URL: ${ANTHROPIC_BASE_URL:-}
      RECOMMENDER_MODEL: ${RECOMMENDER_MODEL:-}
    ports:
      - "4000:4000"
    depends_on:
      postgres:
        condition: service_healthy
      wiremock:
        condition: service_started

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      target: runtime
      args:
        VITE_API_BASE_URL: http://localhost:4000
    environment:
      VITE_API_BASE_URL: http://localhost:4000
    ports:
      - "5173:5173"
    depends_on:
      - api

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: denim_fit
      POSTGRES_USER: denim
      POSTGRES_PASSWORD: denim
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./infra/db/init.sql:/docker-entrypoint-initdb.d/001-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U denim -d denim_fit"]
      interval: 5s
      timeout: 5s
      retries: 10

  wiremock:
    build:
      context: ./infra/wiremock
      dockerfile: Dockerfile
    image: edjeovation-wiremock:local
    ports:
      - "8080:8080"

volumes:
  postgres-data:
