name: Deploy to Azure

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      deploy_core:
        description: Redeploy shared Azure resources even when core files did not change.
        required: false
        default: false
        type: boolean
      force_image_builds:
        description: Rebuild and redeploy all container images.
        required: false
        default: false
        type: boolean

permissions:
  contents: read
  id-token: write

concurrency:
  group: azure-deploy-main
  cancel-in-progress: false

env:
  APP_NAME: denimfit
  AZURE_LOCATION: centralus
  AZURE_RESOURCE_GROUP: AnF-2026

jobs:
  deploy:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Detect deployment changes
        id: changes
        run: |
          set -euo pipefail

          force_core="${{ github.event_name == 'workflow_dispatch' && inputs.deploy_core == true }}"
          force_images="${{ github.event_name == 'workflow_dispatch' && inputs.force_image_builds == true }}"

          if git rev-parse HEAD^ >/dev/null 2>&1; then
            changed_files="$(git diff --name-only HEAD^ HEAD)"
          else
            changed_files="$(git ls-tree -r --name-only HEAD)"
          fi

          deploy_core="$force_core"
          apps_config_changed=false
          api_changed="$force_images"
          web_changed="$force_images"
          wiremock_changed="$force_images"

          while IFS= read -r file; do
            [ -n "$file" ] || continue

            case "$file" in
              infra/azure/core.bicep)
                deploy_core=true
                ;;
              infra/azure/apps.bicep)
                apps_config_changed=true
                ;;
              apps/api/*|infra/db/*)
                api_changed=true
                ;;
              apps/web/*|packages/design-system/*)
                web_changed=true
                ;;
              infra/wiremock/*)
                wiremock_changed=true
                ;;
              package.json|package-lock.json)
                api_changed=true
                web_changed=true
                ;;
            esac
          done <<< "$changed_files"

          deploy_apps=false
          if [ "$apps_config_changed" = "true" ] || \
            [ "$api_changed" = "true" ] || \
            [ "$web_changed" = "true" ] || \
            [ "$wiremock_changed" = "true" ]; then
            deploy_apps=true
          fi

          {
            echo "deploy_core=$deploy_core"
            echo "deploy_apps=$deploy_apps"
            echo "apps_config_changed=$apps_config_changed"
            echo "api_changed=$api_changed"
            echo "web_changed=$web_changed"
            echo "wiremock_changed=$wiremock_changed"
          } >> "$GITHUB_OUTPUT"

          echo "Changed files:"
          if [ -n "$changed_files" ]; then
            printf '%s\n' "$changed_files"
          else
            echo "(none)"
          fi
          echo "Deploy core: $deploy_core"
          echo "Deploy apps: $deploy_apps"
          echo "Build API image: $api_changed"
          echo "Build web image: $web_changed"
          echo "Build WireMock image: $wiremock_changed"
          echo "Apps config changed: $apps_config_changed"

      - name: Ensure main branch deployment
        if: steps.changes.outputs.deploy_core == 'true' || steps.changes.outputs.deploy_apps == 'true'
        run: |
          if [ "${GITHUB_REF}" != "refs/heads/main" ]; then
            echo "Azure OIDC is configured for refs/heads/main; run this workflow from main."
            exit 1
          fi

      - name: Azure login
        if: steps.changes.outputs.deploy_core == 'true' || steps.changes.outputs.deploy_apps == 'true'
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Check Azure providers
        if: steps.changes.outputs.deploy_core == 'true' || steps.changes.outputs.deploy_apps == 'true'
        run: |
          set -euo pipefail
          for namespace in \
            Microsoft.App \
            Microsoft.ContainerRegistry \
            Microsoft.DBforPostgreSQL \
            Microsoft.ManagedIdentity \
            Microsoft.OperationalInsights
          do
            if ! state="$(az provider show --namespace "$namespace" --query registrationState --output tsv)"; then
              echo "Could not read provider state for $namespace; continuing."
              continue
            fi
            if [ "$state" != "Registered" ]; then
              echo "$namespace is $state. Ask a subscription admin to register it before deployment."
              exit 1
            fi
          done

      - name: Resolve shared Azure resources
        if: steps.changes.outputs.deploy_core == 'true' || steps.changes.outputs.deploy_apps == 'true'
        env:
          DEPLOY_CORE: ${{ steps.changes.outputs.deploy_core }}
          POSTGRES_ADMIN_PASSWORD: ${{ secrets.POSTGRES_ADMIN_PASSWORD }}
        run: |
          set -euo pipefail

          latest_core_deployment="$(az deployment group list \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --query "[?starts_with(name, '${APP_NAME}-core-') && properties.provisioningState=='Succeeded'] | sort_by(@, &properties.timestamp)[-1].name" \
            --output tsv)"

          if [ "$DEPLOY_CORE" != "true" ] && [ -n "$latest_core_deployment" ]; then
            deployment_name="$latest_core_deployment"
            echo "Using shared Azure resources from $deployment_name."
          else
            deployment_name="${APP_NAME}-core-${GITHUB_RUN_ID}"
            echo "Deploying shared Azure resources as $deployment_name."

            az deployment group create \
              --name "$deployment_name" \
              --resource-group "$AZURE_RESOURCE_GROUP" \
              --template-file infra/azure/core.bicep \
              --parameters \
                location="$AZURE_LOCATION" \
                appName="$APP_NAME" \
                postgresAdminPassword="$POSTGRES_ADMIN_PASSWORD" \
              --output none
          fi

          {
            echo "CORE_DEPLOYMENT_NAME=$deployment_name"
            echo "ACR_NAME=$(az deployment group show --name "$deployment_name" --resource-group "$AZURE_RESOURCE_GROUP" --query properties.outputs.acrName.value --output tsv)"
            echo "ACR_LOGIN_SERVER=$(az deployment group show --name "$deployment_name" --resource-group "$AZURE_RESOURCE_GROUP" --query properties.outputs.acrLoginServer.value --output tsv)"
            echo "ACR_PULL_IDENTITY_NAME=$(az deployment group show --name "$deployment_name" --resource-group "$AZURE_RESOURCE_GROUP" --query properties.outputs.acrPullIdentityName.value --output tsv)"
            echo "CONTAINERAPPS_ENVIRONMENT_NAME=$(az deployment group show --name "$deployment_name" --resource-group "$AZURE_RESOURCE_GROUP" --query properties.outputs.containerAppsEnvironmentName.value --output tsv)"
            echo "POSTGRES_HOST=$(az deployment group show --name "$deployment_name" --resource-group "$AZURE_RESOURCE_GROUP" --query properties.outputs.postgresHost.value --output tsv)"
            echo "POSTGRES_ADMIN_LOGIN=$(az deployment group show --name "$deployment_name" --resource-group "$AZURE_RESOURCE_GROUP" --query properties.outputs.postgresAdminLogin.value --output tsv)"
            echo "POSTGRES_DATABASE_NAME=$(az deployment group show --name "$deployment_name" --resource-group "$AZURE_RESOURCE_GROUP" --query properties.outputs.postgresDatabaseName.value --output tsv)"
          } >> "$GITHUB_ENV"

      - name: Resolve container images
        if: steps.changes.outputs.deploy_apps == 'true'
        env:
          API_CHANGED: ${{ steps.changes.outputs.api_changed }}
          WEB_CHANGED: ${{ steps.changes.outputs.web_changed }}
          WIREMOCK_CHANGED: ${{ steps.changes.outputs.wiremock_changed }}
        run: |
          set -euo pipefail
          image_tag="$(git rev-parse HEAD)"

          new_api_image="${ACR_LOGIN_SERVER}/${APP_NAME}-api:${image_tag}"
          new_web_image="${ACR_LOGIN_SERVER}/${APP_NAME}-web:${image_tag}"
          new_wiremock_image="${ACR_LOGIN_SERVER}/${APP_NAME}-wiremock:${image_tag}"

          current_image() {
            local app_name="$1"
            local container_name="$2"

            az resource show \
              --name "$app_name" \
              --resource-group "$AZURE_RESOURCE_GROUP" \
              --resource-type Microsoft.App/containerApps \
              --query "properties.template.containers[?name=='${container_name}'].image | [0]" \
              --output tsv 2>/dev/null || true
          }

          api_image="$new_api_image"
          web_image="$new_web_image"
          wiremock_image="$new_wiremock_image"
          build_api="$API_CHANGED"
          build_web="$WEB_CHANGED"
          build_wiremock="$WIREMOCK_CHANGED"

          if [ "$build_api" != "true" ]; then
            api_image="$(current_image "ca-${APP_NAME}-api" "api")"
            if [ -z "$api_image" ]; then
              api_image="$new_api_image"
              build_api=true
              echo "No current API image found; building $api_image."
            fi
          fi

          if [ "$build_web" != "true" ]; then
            web_image="$(current_image "ca-${APP_NAME}-web" "web")"
            if [ -z "$web_image" ]; then
              web_image="$new_web_image"
              build_web=true
              echo "No current web image found; building $web_image."
            fi
          fi

          if [ "$build_wiremock" != "true" ]; then
            wiremock_image="$(current_image "ca-${APP_NAME}-wiremock" "wiremock")"
            if [ -z "$wiremock_image" ]; then
              wiremock_image="$new_wiremock_image"
              build_wiremock=true
              echo "No current WireMock image found; building $wiremock_image."
            fi
          fi

          {
            echo "API_IMAGE=$api_image"
            echo "WEB_IMAGE=$web_image"
            echo "WIREMOCK_IMAGE=$wiremock_image"
            echo "BUILD_API_IMAGE=$build_api"
            echo "BUILD_WEB_IMAGE=$build_web"
            echo "BUILD_WIREMOCK_IMAGE=$build_wiremock"
          } >> "$GITHUB_ENV"

          echo "API image: $api_image (build: $build_api)"
          echo "Web image: $web_image (build: $build_web)"
          echo "WireMock image: $wiremock_image (build: $build_wiremock)"

      - name: Build and push changed container images
        if: steps.changes.outputs.deploy_apps == 'true'
        run: |
          set -euo pipefail

          if [ "$BUILD_API_IMAGE" != "true" ] && \
            [ "$BUILD_WEB_IMAGE" != "true" ] && \
            [ "$BUILD_WIREMOCK_IMAGE" != "true" ]; then
            echo "No container image builds needed."
            exit 0
          fi

          az acr login --name "$ACR_NAME"

          if [ "$BUILD_API_IMAGE" = "true" ]; then
            docker build --file apps/api/Dockerfile --tag "$API_IMAGE" .
            docker push "$API_IMAGE"
          fi

          if [ "$BUILD_WEB_IMAGE" = "true" ]; then
            docker build --file apps/web/Dockerfile --tag "$WEB_IMAGE" .
            docker push "$WEB_IMAGE"
          fi

          if [ "$BUILD_WIREMOCK_IMAGE" = "true" ]; then
            docker build --file infra/wiremock/Dockerfile --tag "$WIREMOCK_IMAGE" infra/wiremock
            docker push "$WIREMOCK_IMAGE"
          fi

      - name: Deploy Container Apps
        if: steps.changes.outputs.deploy_apps == 'true'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ANTHROPIC_BASE_URL: ${{ secrets.ANTHROPIC_BASE_URL }}
          POSTGRES_ADMIN_PASSWORD: ${{ secrets.POSTGRES_ADMIN_PASSWORD }}
          RECOMMENDER_MODEL: ${{ secrets.RECOMMENDER_MODEL }}
        run: |
          set -euo pipefail
          deployment_name="${APP_NAME}-apps-${GITHUB_RUN_ID}"
          recommender_model="${RECOMMENDER_MODEL:-claude-opus-4-8}"

          az deployment group create \
            --name "$deployment_name" \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --template-file infra/azure/apps.bicep \
            --parameters \
              location="$AZURE_LOCATION" \
              appName="$APP_NAME" \
              containerAppsEnvironmentName="$CONTAINERAPPS_ENVIRONMENT_NAME" \
              acrLoginServer="$ACR_LOGIN_SERVER" \
              acrPullIdentityName="$ACR_PULL_IDENTITY_NAME" \
              apiImage="$API_IMAGE" \
              webImage="$WEB_IMAGE" \
              wiremockImage="$WIREMOCK_IMAGE" \
              postgresHost="$POSTGRES_HOST" \
              postgresAdminLogin="$POSTGRES_ADMIN_LOGIN" \
              postgresAdminPassword="$POSTGRES_ADMIN_PASSWORD" \
              postgresDatabaseName="$POSTGRES_DATABASE_NAME" \
              anthropicApiKey="$ANTHROPIC_API_KEY" \
              anthropicBaseUrl="$ANTHROPIC_BASE_URL" \
              recommenderModel="$recommender_model" \
            --output none

          {
            echo "APPS_DEPLOYMENT_NAME=$deployment_name"
            echo "API_URL=$(az deployment group show --name "$deployment_name" --resource-group "$AZURE_RESOURCE_GROUP" --query properties.outputs.apiUrl.value --output tsv)"
            echo "WEB_URL=$(az deployment group show --name "$deployment_name" --resource-group "$AZURE_RESOURCE_GROUP" --query properties.outputs.webUrl.value --output tsv)"
          } >> "$GITHUB_ENV"

      - name: Smoke test deployment
        if: steps.changes.outputs.deploy_apps == 'true'
        run: |
          set -euo pipefail
          curl --fail --retry 12 --retry-delay 10 --retry-all-errors "$API_URL/health"
          curl --fail --retry 12 --retry-delay 10 --retry-all-errors "$WEB_URL"
          echo "Web URL: $WEB_URL"
          echo "API URL: $API_URL"

      - name: No Azure deployment needed
        if: steps.changes.outputs.deploy_core != 'true' && steps.changes.outputs.deploy_apps != 'true'
        run: echo "No Azure deployment required for the changed paths."
